<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demande d'inscription</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <from method="post" action="inscription.php">
      <h1>Demande d'inscription</h1>
      <div class="info">
      <h2 class="info">1- Informations sur le demandeur :</h2>
      <label for="identifiant">Identification Digital Civil et Social :</label>
      <input type="text" id="Identification" />
      <p>Date de naissance :</p>
      <label for="jour">jours :</label>
      <input type="text" id="jour" name="jours" />
      <label for="mois">Mois :</label>
      <input type="text" id="mois" name="mois" />
      <label for="annee">Année :</label>
      <input type="text" id="annee" name="annee" />
      <label for="motdepasse">Mot de passe du compte :</label>
      <input type="password" id="motdepasse" name="motdepasse" />
      </div>
      <h2 class="enfants">2- Liste des enfants pris en charge :</h2>
      <table class="enfants" border="1">
        <tr>
          <th colspan="3">Liste des enfants pris en charge</th>
        </tr>
        <tr>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Date</th>
        </tr>
        <tr>
          <td><input type="text" name="Nom" /></td>
          <td><input type="text" name="Prénom" /></td>
          <td><input type="text" name="Date" /></td>
        </tr>
        <tr>
          <td><input type="text" /></td>
          <td><input type="text" /></td>
          <td><input type="text" /></td>
        </tr>
      </table>
      <p></p>
      <label for="code">Saisissez le code :</label>
      <input type="text" id="code" name="code" />
      <label for="Observation">Observation</label>
      <textarea id="Observation" name="Observation" rows="4"></textarea>
    </from>
  </body>
</html>
